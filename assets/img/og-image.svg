    <rect x="340" width="300" height="110" rx="20" fill="#FFD9C4"/><text x="490" y="70" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-weight="700" font-size="36" fill="#1F2A37">2 · F = m·a</text>
    <rect x="680" width="360" height="110" rx="20" fill="#DCD3F5"/><text x="860" y="70" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-weight="700" font-size="36" fill="#1F2A37">3 · Azione-reazione</text>
