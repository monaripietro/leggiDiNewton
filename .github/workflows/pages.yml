name: Verifica e pubblica su GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nessun segnaposto [[DA VERIFICARE]]
        run: node tools/check-placeholders.js
      - name: Chiavi i18n allineate
        run: node tools/check-i18n.js
      - name: Pagine HTML aggiornate rispetto ai dizionari
        run: node tools/build.js --check
      - name: Link interni validi
        run: node tools/check-links.js
      - name: Contrasti dei colori
        run: node tools/contrast-check.js
      - name: Test di fisica
        run: node --test tests/physics.test.js

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara solo i file del sito
        run: |
          mkdir _site
          cp -r *.html sw.js robots.txt sitemap.xml .nojekyll CREDITS.md LICENSE assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
